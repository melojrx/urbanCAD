version: '3.8'

services:
  postgres:
    image: postgis/postgis:13-3.1
    container_name: urbancad_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urbancad}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - urbancad_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbancad_web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-urbancad}
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      FLASK_APP: ${FLASK_APP:-app.py}
      FLASK_RUN_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/static:/app/app/static
    networks:
      - urbancad_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: urbancad_nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "${NGINX_SSL_PORT:-4443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    networks:
      - urbancad_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  urbancad_network:
    driver: bridge