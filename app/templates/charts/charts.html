{% extends 'base.html' %}
{% block conteudo %}

<script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/1.0.2/Chart.min.js'></script>


<div class="container-fluid mt-2 p-0 m-0">
    <div class="container-fluid">
        <h1 class="mt-4">Estatísticas</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item active">Acompanhe os principais KPIs do Sistema</li>
        </ol>
        <div class="row">
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-chart-bar me-1"></i>
                        Ocorrências por Status
                    </div>
                    <canvas class="card-body d-flex" id="chart" ></canvas>
                    <div class="card-footer small text-muted">Atualizado em 21/03/2024 às 11:59 PM</div>
                </div>
            </div>
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-chart-bar me-1"></i>
                        Ocorrências por Região
                    </div>
                    <div class="card-body"><canvas id="myBarChart" width="100%" height="40"></canvas></div>
                    <div class="card-footer small text-muted">Atualizado em 21/03/2024 às 11:59 PM</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// bar chart data
var barData = {
        labels : [
        {% for row in listOcorrencia %}
        "{{ row.status }}",
        {% endfor %}
    ],
        datasets : [{
            label: 'Valor:',
            fillColor: "rgba(2,117,216,1)",
            strokeColor: "rgba(151,187,205,1)",
            pointColor: "rgba(151,187,205,1)",
            data : [
                {% for row in listOcorrencia %}
                "{{ row.total }}",
                {% endfor %}
                ]
        }]
    }

// get bar chart canvas
var mychart = document.getElementById("chart").getContext("2d");
//steps = 10
//max = {{max}}

// draw bar chart
new Chart(mychart).Bar(barData, {
    responsive : true,
    scaleOverride: true,
    scaleSteps: 5,
    scaleStepWidth: 5,
    scaleStartValue: 0,
    scaleShowVerticalLines: true,
    scaleShowGridLines : true,
    barShowStroke : true,
    scaleShowLabels: true,
    xAxes: [{ display: false }], 
    legend: { display: true 
    }
    }
);


</script>


{% endblock conteudo %}
